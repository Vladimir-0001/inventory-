<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
/* Layout: one phone column. Sticky slim top bar, iOS large titles, inset grouped lists, frosted tab bar with a raised Scan key, bottom sheets for detail and forms. */
:root{
  --bg:#000000;
  --surface:#151517;
  --surface-2:#232327;
  --sheet:#1B1B1E;
  --sheet-cell:#26262A;
  --sheet-cell-2:#323237;
  --line:rgba(255,255,255,.09);
  --fg:#F5F5F7;
  --fg-2:#9C9CA4;
  --fg-3:#5E5E66;
  --accent:#FF9E45;      /* tungsten 3200K */
  --accent-ink:#1E1004;
  --ok:#34D35A;
  --out:#5CC4FA;         /* daylight 5600K */
  --bad:#FF4D42;
  --warn:#FFD23F;
  --miss:#C06BF2;
  --mute:#6E6E76;
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Roboto Mono",Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F2F2F6;--surface:#FFFFFF;--surface-2:#E8E8ED;--sheet:#F2F2F6;--sheet-cell:#FFFFFF;--sheet-cell-2:#E6E6EB;
    --line:rgba(0,0,0,.09);--fg:#111113;--fg-2:#6C6C74;--fg-3:#A6A6AE;
    --accent:#DD6A06;--accent-ink:#FFFFFF;--ok:#1E9B3B;--out:#0B7FC6;--bad:#DE2A1E;--warn:#B58600;--miss:#9840CC;--mute:#8E8E96;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F2F2F6;--surface:#FFFFFF;--surface-2:#E8E8ED;--sheet:#F2F2F6;--sheet-cell:#FFFFFF;--sheet-cell-2:#E6E6EB;
  --line:rgba(0,0,0,.09);--fg:#111113;--fg-2:#6C6C74;--fg-3:#A6A6AE;
  --accent:#DD6A06;--accent-ink:#FFFFFF;--ok:#1E9B3B;--out:#0B7FC6;--bad:#DE2A1E;--warn:#B58600;--miss:#9840CC;--mute:#8E8E96;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html.locked,html.locked body{overflow:hidden}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--font-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,label:focus-visible,.inp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,.mono{font-family:var(--font-mono);font-size:.9em;letter-spacing:-.01em}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin-inline:-16px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px)}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:11px;letter-spacing:.02em;flex-shrink:0}
.brand-name{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-2);white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sc,var(--fg-3))}
.tb-actions{display:flex;align-items:center;gap:6px}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--fg)}
.iconbtn.acc{background:var(--accent);color:var(--accent-ink)}
.iconbtn .i{width:20px;height:20px}
.large{font-size:34px;font-weight:800;letter-spacing:-.028em;line-height:1.1;margin:4px 0 14px;text-wrap:balance}
.eyebrow{font-size:13px;color:var(--fg-2);font-weight:600;margin-top:6px}
.banner{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:6px 8px calc(4px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 80%,transparent);-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);border-top:.5px solid var(--line)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--fg-2);padding:4px 0 2px;text-align:center}
.tab .i{width:25px;height:25px}
.tab[aria-current="page"]{color:var(--accent)}
.tab-scan .dot{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-24px;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 38%,transparent),0 0 0 5px var(--bg)}
.tab-scan .dot .i{width:27px;height:27px;stroke-width:2}

/* lists */
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:28px 4px 8px}
.sec h2{font-size:20px;font-weight:700;letter-spacing:-.015em;margin:0}
.sec .link{color:var(--accent);font-size:15px;font-weight:500}
.glabel{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--fg-2);text-transform:uppercase;letter-spacing:.06em;margin:22px 4px 7px}
.group{background:var(--surface);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;min-height:62px;position:relative;text-align:left}
.row+.row::before,.lrow+.lrow::before{content:"";position:absolute;top:0;left:64px;right:0;border-top:.5px solid var(--line)}
.row:active{background:var(--surface-2)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row-t{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:13px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.row-time{font-size:12px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.row-time.bad{color:var(--bad);font-weight:600}
.row .chev{color:var(--fg-3);width:16px;height:16px}
.cb{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--fg-3);display:grid;place-items:center;flex-shrink:0;color:transparent}
.cb .i{width:15px;height:15px;stroke-width:2.6}
.on .cb{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lrow{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;position:relative}
.lic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--lc,var(--fg-2));flex-shrink:0}
.lic .i{width:18px;height:18px}
.ltext{font-size:14.5px;line-height:1.35}
.ltext b{font-weight:600}

/* gear tile */
.gi{position:relative;flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;color:var(--fg)}
.gi .i{width:23px;height:23px}
.gi[data-s]::after{content:"";position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;background:var(--sc);border:2.5px solid var(--surface)}
.gi-lg{width:76px;height:76px;border-radius:20px}
.gi-lg .i{width:42px;height:42px;stroke-width:1.35}
.gi-lg[data-s]::after{width:16px;height:16px;right:-4px;bottom:-4px;border-width:3px}
.gi-md{width:46px;height:46px;border-radius:13px}
.gi-md .i{width:26px;height:26px}

/* pills / chips */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 8px 3px 7px;border-radius:99px;color:var(--pc);background:color-mix(in srgb,var(--pc) 15%,transparent);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:99px;background:var(--surface);font-size:14px;font-weight:500;white-space:nowrap}
.chip-n{font-size:12px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip[aria-pressed="true"] .chip-n{color:inherit;opacity:.65}

.seg button{flex:1;padding:7px 6px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--fg-2);text-align:center;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.18)}

/* search / filters */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:0 12px;height:42px;margin-bottom:10px}
.search .i{color:var(--fg-2);width:19px;height:19px}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px;height:100%}

.filters{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.sel{appearance:none;-webkit-appearance:none;background:var(--surface);border:0;border-radius:99px;padding:7px 28px 7px 13px;font-size:14px;font-weight:500;max-width:46%;background-image:linear-gradient(45deg,transparent 50%,var(--fg-2) 50%),linear-gradient(135deg,var(--fg-2) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.spacer{flex:1}
.textbtn{color:var(--accent);font-weight:600;font-size:15px;padding:6px 2px}

/* dashboard */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:18px;padding:14px 15px;display:flex;flex-direction:column;gap:3px;min-height:100px;text-align:left}

.tile .lbl{font-size:13px;color:var(--fg-2);font-weight:600;display:flex;align-items:center;gap:6px}

.tile .n{font-size:34px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.05;margin-top:auto}
.tile .sub{font-size:12.5px;color:var(--fg-2)}
.tile.hot .n{color:var(--tc)}
.tile-wide{grid-column:1/-1;min-height:0}
.tile-wide .n{font-size:44px;margin-top:6px}
.stack{display:flex;height:9px;border-radius:99px;overflow:hidden;gap:2px;margin-top:12px;background:var(--surface-2)}
.stack span{background:var(--sc);min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:12.5px;color:var(--fg-2)}
.legend span{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.legend span::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--sc)}

/* cards */
.cards{display:flex;flex-direction:column;gap:10px}
.kcard{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:16px;padding:14px;width:100%;text-align:left}
.kcard:active{background:var(--surface-2)}
.kc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.kc-end{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0}
.kc-n{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.strip{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.mini{width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;position:relative}
.mini .i{width:17px;height:17px}
.mini::after{content:"";position:absolute;right:-2px;bottom:-2px;width:8px;height:8px;border-radius:50%;background:var(--sc);border:2px solid var(--surface)}
.mini.more{font-size:11px;font-weight:700;color:var(--fg-2)}
.mini.more::after{display:none}
.prog{display:block;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:10px}
.prog span{display:block;height:100%;background:var(--pc,var(--accent));border-radius:99px;transition:width .3s}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--fg-2);margin-top:4px}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta .i{width:14px;height:14px}

/* empty / loading */
.empty{background:var(--surface);border-radius:18px;padding:28px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.empty .gi{background:var(--surface-2)}
.empty h3{margin:6px 0 0;font-size:19px;font-weight:700;text-wrap:balance}
.empty p{margin:0;color:var(--fg-2);max-width:36ch;font-size:14.5px}
.skel{height:62px;border-radius:14px;background:var(--surface);margin-bottom:8px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}

/* buttons */
.btn{height:50px;border-radius:14px;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:0 16px;text-align:center}
.btn .i{width:20px;height:20px}
.btn-p{background:var(--accent);color:var(--accent-ink)}
.btn-s{background:var(--surface-2);color:var(--fg)}
.btn-d{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn-row{display:flex;gap:10px}
.btn-sm{height:38px;border-radius:11px;font-size:14.5px;width:auto;padding:0 14px}
.stackbtns{display:flex;flex-direction:column;gap:10px;margin-top:18px}

/* scan */
.scanpad{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;aspect-ratio:1.45;max-width:100%;width:100%;border-radius:22px;background:radial-gradient(120% 90% at 50% 40%,var(--surface-2),var(--surface));text-align:center;cursor:pointer;padding:20px}
.scanpad:active{transform:scale(.99)}
.vf{position:absolute;inset:18px;pointer-events:none}
.vf i{position:absolute;width:30px;height:30px;border-color:var(--accent);border-style:solid;border-width:0}
.vf i:nth-child(1){top:0;left:0;border-top-width:3px;border-left-width:3px;border-top-left-radius:10px}
.vf i:nth-child(2){top:0;right:0;border-top-width:3px;border-right-width:3px;border-top-right-radius:10px}
.vf i:nth-child(3){bottom:0;left:0;border-bottom-width:3px;border-left-width:3px;border-bottom-left-radius:10px}
.vf i:nth-child(4){bottom:0;right:0;border-bottom-width:3px;border-right-width:3px;border-bottom-right-radius:10px}
.scanpad .big{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.scanpad .big .i{width:32px;height:32px;stroke-width:2}
.scanpad b{font-size:18px}
.scanpad small{color:var(--fg-2);font-size:13.5px;max-width:30ch}
.vh{position:absolute!important;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.sugg{margin-top:8px}
.result{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:12px 14px;margin-top:12px;animation:pop .3s ease}
.result.bad{background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
@keyframes pop{from{transform:scale(.97);opacity:.4}}
.cartbar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin-top:14px;z-index:5}

/* select bar */
.selbar{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:15;padding:0 16px}
.selbar-in{max-width:608px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.selbar-in b{flex:1;font-size:14.5px;white-space:nowrap}
.selbar-in button{background:color-mix(in srgb,var(--bg) 14%,transparent);border-radius:10px;padding:8px 11px;font-size:14px;font-weight:600;white-space:nowrap}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:40;animation:fade .22s ease}
#sheet{--surface:var(--sheet-cell);--surface-2:var(--sheet-cell-2);position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:640px;margin:0 auto;max-height:calc(100% - env(safe-area-inset-top,0px) - 18px);display:flex;flex-direction:column;background:var(--sheet);border-radius:16px 16px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.35);animation:up .34s cubic-bezier(.2,.85,.25,1)}

@keyframes fade{from{opacity:0}}

.sh-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:6px 14px 8px;flex-shrink:0;touch-action:none}
.sh-head>div:last-child{justify-self:end}
.sh-title{font-weight:700;font-size:16px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.sh-btn{color:var(--accent);font-size:16px;font-weight:500;padding:6px 0;white-space:nowrap}
.sh-btn.b{font-weight:700}
.sh-body{overflow-y:auto;padding:6px 16px calc(28px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:8px 0 18px}
.hero h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:8px 0 0;text-wrap:balance}
.hero .code{font-family:var(--font-mono);font-size:14px;color:var(--fg-2)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px;margin-bottom:8px}
.act{background:var(--surface);border-radius:14px;padding:12px 13px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;font-weight:600;font-size:14.5px;text-align:left}
.act .i{color:var(--ac,var(--accent))}
.act:active{background:var(--surface-2)}
.act.primary{background:var(--accent);color:var(--accent-ink)}

.facts{background:var(--surface);border-radius:14px;overflow:hidden}
.fact{display:flex;justify-content:space-between;gap:16px;padding:12px 14px;position:relative;font-size:15px}

.fact span:first-child{color:var(--fg-2);flex-shrink:0}
.fact span:last-child{text-align:right;min-width:0;overflow-wrap:anywhere}
.qrcard{background:var(--surface);border-radius:16px;padding:16px;display:flex;gap:16px;align-items:center}
.qr{width:116px;height:116px;border-radius:10px;flex-shrink:0;display:block;background:#fff}
.qrcard .qr-info{min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.note{font-size:13px;color:var(--fg-2);margin:8px 4px 0;line-height:1.45}
.warnbox{background:color-mix(in srgb,var(--warn) 13%,var(--surface));border-radius:12px;padding:10px 13px;font-size:13.5px;margin-bottom:12px}
.issue{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border-radius:12px;padding:10px 13px;font-size:14px;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start}
.issue .i{color:var(--warn);width:19px;height:19px;margin-top:1px}

/* forms */
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lb{font-size:13px;color:var(--fg-2);font-weight:600;padding-left:4px}
.inp{height:48px;border-radius:12px;background:var(--surface);border:1.5px solid transparent;padding:0 14px;width:100%;font-size:16px;outline:0;min-width:0}
textarea.inp{height:auto;min-height:84px;padding:12px 14px;resize:vertical;line-height:1.4}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--fg-2) 50%),linear-gradient(135deg,var(--fg-2) 50%,transparent 50%);background-position:calc(100% - 19px) 50%,calc(100% - 14px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.inp:focus{border-color:var(--accent)}
.inp.err{border-color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px;background:var(--surface);border-radius:14px;padding:8px}
.icons label{aspect-ratio:1;border-radius:11px;display:grid;place-items:center;cursor:pointer;color:var(--fg-2)}
.icons input{position:absolute;opacity:0;pointer-events:none}
.icons input:checked+label{background:var(--accent);color:var(--accent-ink)}
.icons input:focus-visible+label{outline:2px solid var(--accent)}
.hint{font-size:12.5px;color:var(--fg-2);padding-left:4px}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice label{padding:9px 14px;border-radius:12px;background:var(--surface);font-weight:600;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.choice label::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cc,var(--fg-3))}
.choice input:checked+label{background:var(--fg);color:var(--bg)}
.picklist{max-height:none}
.pickhead{display:flex;justify-content:space-between;align-items:center;margin:4px 4px 2px}
.labelprev{width:100%;border-radius:10px;background:#fff;display:block;box-shadow:0 0 0 1px var(--line)}
.labelgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.labelgrid figure{margin:0;display:flex;flex-direction:column;gap:8px}

.av{border-radius:50%;object-fit:cover;flex-shrink:0;display:block;background:var(--surface-2)}
.av-x{display:grid;place-items:center;color:var(--fg-2)}
.av-x .i{width:60%;height:60%}
.avbtn{padding:0;overflow:hidden}
.brand-mark.big{width:72px;height:72px;border-radius:20px;font-size:24px;margin:0 auto}
.login{max-width:420px;margin:0 auto;padding-top:9vh;display:flex;flex-direction:column}
.initials{font-weight:700;font-size:13px;background:var(--fg);color:var(--bg)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14.5px;font-weight:600;max-width:calc(100% - 32px);width:max-content;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:pop .25s ease;text-align:center}
.mt{margin-top:14px}.mt2{margin-top:24px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (min-width:700px){.large{font-size:38px}}
@media (max-width:430px){.sync{font-size:0;gap:0}.brand-name{letter-spacing:.1em}}

const wq={};let pending=0;

const CFG=window.MR_CONFIG||{};
const AUTHK='marcele-gear-auth';
async function rpc(fn,args){const h={'apikey':CFG.key,'Content-Type':'application/json'};if(!/^sb_/.test(CFG.key||''))h.Authorization='Bearer '+CFG.key;
  let r;try{r=await fetch(CFG.url.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args)})}catch(e){const x=new Error('offline');x.code='unavailable';throw x}
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){const m=(j&&(j.message||j.hint))||('HTTP '+r.status);const x=new Error(m);x.code=r.status>=500?'unavailable':/bad code/.test(m)?'auth':/admin only/.test(m)?'admin':'invalid_argument';throw x}return j}
const tput=(col,id,data,merge,deleted)=>rpc('mr_put',{p_code:S.auth.code,p_col:col,p_id:id,p_data:data,p_merge:!!merge,p_deleted:!!deleted});
let since=null,pulling=false;const LOGM={};
function applyRows(rows){rows.forEach(r=>{const c=r.col;if(c==='settings'){if(r.id==='main')S.settings=r.deleted?null:r.data;return}if(c==='log'){if(r.deleted)delete LOGM[r.id];else LOGM[r.id]=Object.assign({},r.data,{id:r.id});return}if(!S[c]||typeof S[c]!=='object')return;if(r.deleted)delete S[c][r.id];else S[c][r.id]=Object.assign({},r.data,{id:r.id})});S.log=Object.values(LOGM).sort((a,b)=>b.ts-a.ts).slice(0,800)}
async function pull(){if(S.mode!=='team'||!S.auth||pulling||pending)return;pulling=true;try{const r=await rpc('mr_pull',{p_code:S.auth.code,p_since:since});since=r.now;applyRows(r.rows||[]);S.orgName=r.org;if(r.role&&r.role!==S.auth.role){S.auth.role=r.role;saveAuth()}S.loaded=true;S.online=true;cacheTeam();render()}catch(e){if(e.code==='auth'){signOut('The team code changed. Ask an admin for the new one.')}else{S.online=false;render()}}finally{pulling=false}}

async function writeErr(e,fn){const c=e&&e.code;if(c==='unavailable'){await sleep(400+Math.random()*700);try{await fn();return}catch(e2){}}
  if(c==='invalid_argument'&&S.canWrite!==true){S.canWrite=false;render();toast('You have view-only access. Ask the owner for Contributor access to make changes.');return}
  if(c==='admin'){toast('Only admins can do that.');pull();return}

  if(c==='quota_exceeded'){toast('Storage is full. Remove sample gear or old shoots in Settings.');return}

  console.warn('write failed',e);toast('That change did not save. Check your connection and try again.')}
function put(col,id,data){data=clean(data);delete data.id;S[col][id]=Object.assign({},data,{id});render();if(S.mode==='team')enqueue(col+'/'+id,()=>tput(col,id,data));else if(S.mode==='cloud')enqueue(col+'/'+id,()=>db.collection(col).doc(id).set(data));else saveLocal()}

function toMap(snap){const o={};snap.docs.forEach(d=>{o[d.id]=Object.assign({},d.data(),{id:d.id})});return o}

  const subs={
    items:()=>db.collection('items').onSnapshot(s=>{S.items=toMap(s);S.loaded=true;render()},onErr('items')),
    kits:()=>db.collection('kits').onSnapshot(s=>{S.kits=toMap(s);render()},onErr('kits')),
    shoots:()=>db.collection('shoots').onSnapshot(s=>{S.shoots=toMap(s);render()},onErr('shoots')),
    log:()=>db.collection('log').orderBy('ts','desc').limit(400).onSnapshot(s=>{S.log=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));resolveNames();render()},onErr('log')),
    settings:()=>db.doc('settings/main').onSnapshot(d=>{S.settings=d.exists?d.data():null;render()},onErr('settings')),
    members:()=>db.collection('members').onSnapshot(s=>{S.members=toMap(s);S.membersLoaded=true;join();resolveNames();render()},onErr('members')),
    roles:()=>db.doc('team/roles').onSnapshot(d=>{S.roles=(d.exists&&d.data().roles)||{};render()},onErr('roles'))
  };
  function onErr(k){return e=>{console.warn('sync',k,e);if(e&&e.code==='revoked'){S.mode='revoked';render();return}if(e&&e.code==='unavailable')setTimeout(()=>{try{subs[k]()}catch(x){}},3000+Math.random()*2000)}}

}
let nameT=0;
function resolveNames(){if(!user)return;clearTimeout(nameT);nameT=setTimeout(async()=>{const ids=[...new Set(S.log.map(l=>l.by).concat(Object.keys(S.members)).filter(Boolean))];if(!ids.length)return;try{const ps=await user.profiles(ids);let ch=false;ids.forEach(id=>{const p=ps[id];if(!p)return;const n=p.name||'';if(S.names[id]!==n||!S.profiles[id]){S.names[id]=n;S.profiles[id]=p;ch=true}});if(ch)render()}catch(e){}},150)}
function join(){if(S.joined||!db||!S.uid||S.canWrite===false||!S.membersLoaded)return;S.joined=true;const now=Date.now();const m=S.members[S.uid];
  const body=m?{lastSeen:now}:{joinedAt:now,lastSeen:now};if(S.isOwner)body.owner=true;
  if(m&&!S.isOwner&&m.lastSeen&&now-m.lastSeen<3*36e5)return;
  enqueue('members/'+S.uid,()=>m?db.collection('members').doc(S.uid).update(body):db.collection('members').doc(S.uid).set(body))}

function tile(l,n,sub,f,c,i){return '<button class="tile'+(n?' hot':'')+'" data-act="filter" data-v="'+f+'" style="--tc:var(--'+c+')"><span class="lbl">'+ic(i)+l+'</span><span class="n">'+n+'</span><span class="sub">'+sub+'</span></button>'}

function itemRow(it,o){o=o||{};const s=st(it);const act=o.act||'item';const sub=['<code>'+esc(it.code||'')+'</code>',(s==='out'||s==='overdue')?(it.holder?esc(it.holder):''):esc(it.location||'')].filter(Boolean).join(' · ');const t=o.noTime?'':dueText(it);

function filterItems(all){const q=UI.q.trim().toLowerCase();return all.filter(i=>{const s=st(i);
  if(UI.status==='out'&&!(s==='out'||s==='overdue'))return false;
  if(UI.status==='available'&&s!=='available')return false;
  if(UI.status==='overdue'&&s!=='overdue')return false;

  if(q&&![i.name,i.code,i.serial,i.specs,i.holder,i.location,i.notes,(CATS[i.category]||{}).l].join(' ').toLowerCase().includes(q))return false;

function kitRow(k,act){const its=(k.itemIds||[]).map(id=>S.items[id]).filter(Boolean);const av=its.filter(i=>i.status==='available').length;return '<button class="row" data-act="'+(act||'kit')+'" data-id="'+k.id+'" data-code="'+esc(k.code||'')+'"><span class="gi">'+ic((KIT_TYPES[k.type]||{}).i||'case')+'</span><span class="row-main"><span class="row-t">'+esc(k.name)+'</span><span class="row-s"><code>'+esc(k.code||'')+'</code> · '+its.length+' items</span></span><span class="row-end"><span class="row-time">'+av+'/'+its.length+' in</span></span></button>'}

function vKits(){let h='<h1 class="large">Builds &amp; kits</h1>'+banner();if(!S.loaded)return loadingView('Builds &amp; kits');

function openSheet(s){UI.sheets.push(s);drawSheet(true)}

function closeSheet(all){if(all)UI.sheets=[];else UI.sheets.pop();drawSheet(true)}
function drawSheet(force){const sh=$('#sheet'),sc=$('#scrim');const s=top();
  if(!s){if(!sh.hidden){sh.hidden=true;sc.hidden=true;sh.innerHTML='';sh._s=null;document.documentElement.classList.remove('locked')}return}
  const def=SHEETS[s.kind];if(!force&&!def.live)return;
  const same=sh._s===s;const body=sh.querySelector('.sh-body');const scroll=same&&body?body.scrollTop:0;
  sh.hidden=false;sc.hidden=false;document.documentElement.classList.add('locked');
  const r=def.render(s);
  const left=UI.sheets.length>1?'<button class="sh-btn" data-act="back">‹ Back</button>':'<button class="sh-btn" data-act="close">'+(def.form?'Cancel':'Close')+'</button>';
  setHTML(sh,'<div class="sh-grab"></div><div class="sh-head"><div>'+left+'</div><div class="sh-title">'+esc(r.title||'')+'</div><div>'+(r.right||'')+'</div></div><div class="sh-body">'+r.body+'</div>');
  sh._s=s;const nb=sh.querySelector('.sh-body');if(nb)nb.scrollTop=scroll;
  if(def.after)def.after(s);
}

function pickList(s){const q=(s.pq||'').toLowerCase();const its=Object.values(S.items).filter(i=>i.status!=='retired'&&(!q||(i.name+' '+i.code).toLowerCase().includes(q)));if(!its.length)return '<p class="hint mt">'+(q?'No gear matches.':'Add gear to your inventory first.')+'</p>';return grouped(its,i=>itemRow(i,{act:'pickToggle',check:true,on:s.sel.has(i.id),noTime:true,end:''}))}

/* ---------- QR + labels ---------- */
function qrM(text){if(typeof window.qrcode!=='function')return null;try{const q=window.qrcode(0,'M');q.addData(String(text||''));q.make();return q}catch(e){return null}}
function qrSVG(text){const q=qrM(text);if(!q)return '<div class="qr" style="display:grid;place-items:center;color:#555;font-size:12px;text-align:center;padding:8px">QR loads when online</div>';const n=q.getModuleCount();let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+='M'+(c+2)+' '+(r+2)+'h1v1h-1z';return '<svg class="qr" viewBox="0 0 '+(n+4)+' '+(n+4)+'" shape-rendering="crispEdges" role="img" aria-label="QR code for '+esc(text)+'"><rect width="100%" height="100%" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>'}
const SYS='-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif',MONO='ui-monospace,"SF Mono",Menlo,Consolas,monospace';
function drawQR(ctx,text,x,y,size){const q=qrM(text);ctx.fillStyle='#fff';ctx.fillRect(x,y,size,size);if(!q){ctx.fillStyle='#000';ctx.font='600 '+Math.round(size*.12)+'px '+SYS;ctx.fillText('QR',x+size*.4,y+size*.45);return}const n=q.getModuleCount();const cell=Math.floor(size/(n+2));const off=Math.floor((size-cell*n)/2);ctx.fillStyle='#000';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(x+off+c*cell,y+off+r*cell,cell,cell)}
function wrapText(ctx,text,maxW,maxLines){const words=String(text).split(/\s+/).filter(Boolean);const lines=[];let cur='',idx=0;
  while(idx<words.length){const t=cur?cur+' '+words[idx]:words[idx];if(!cur||ctx.measureText(t).width<=maxW){cur=t;idx++}else{lines.push(cur);cur='';if(lines.length===maxLines)break}}
  if(cur&&lines.length<maxLines){lines.push(cur);cur=''}
  const cut=idx<words.length||cur!=='';
  lines.forEach((l,k)=>{const last=k===lines.length-1;if(ctx.measureText(l).width>maxW||(last&&cut)){let x=l;while(x.length>1&&ctx.measureText(x+'…').width>maxW)x=x.slice(0,-1);lines[k]=x+'…'}});return lines}
function fitFont(ctx,text,weight,start,family,maxW){let sz=start;ctx.font=weight+' '+sz+'px '+family;while(sz>8&&ctx.measureText(text).width>maxW){sz-=1;ctx.font=weight+' '+sz+'px '+family}return sz}
function drawLabel(ctx,x,y,w,h,L){ctx.save();ctx.fillStyle='#fff';ctx.fillRect(x,y,w,h);const p=Math.round(h*.08);const q=h-p*2;drawQR(ctx,L.code,x+p,y+p,q);
  const tx=x+p+q+Math.round(p*.7),tw=x+w-p-tx;ctx.textBaseline='top';ctx.fillStyle='#111';
  fitFont(ctx,brandShort().toUpperCase(),'700',Math.round(h*.075),SYS,tw);ctx.fillText(brandShort().toUpperCase(),tx,y+p+h*.02);
  ctx.font='700 '+Math.round(h*.13)+'px '+SYS;const lines=wrapText(ctx,L.name,tw,2);lines.forEach((ln,k)=>ctx.fillText(ln,tx,y+p+h*.14+k*h*.155));
  const cs=fitFont(ctx,L.code,'700',Math.round(h*.135),MONO,tw);ctx.fillText(L.code,tx,y+h-p-h*.1-cs-h*.025);
  ctx.fillStyle='#555';fitFont(ctx,L.sub||'','500',Math.round(h*.08),SYS,tw);ctx.fillText(L.sub||'',tx,y+h-p-h*.085);ctx.restore()}
function sheetCanvas(labels){const dpi=300,c=document.createElement('canvas');c.width=Math.round(8.5*dpi);c.height=11*dpi;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);labels.forEach((L,i)=>{const col=i%3,row=Math.floor(i/3);drawLabel(x,Math.round((0.1875+col*2.75)*dpi),Math.round((0.5+row)*dpi),Math.round(2.625*dpi),dpi,L)});return c}
function singleCanvas(L){const c=document.createElement('canvas');c.width=600;c.height=300;drawLabel(c.getContext('2d'),0,0,600,300,L);return c}
function crc32(buf){let crc=0xFFFFFFFF;for(let n=0;n<buf.length;n++){let c=(crc^buf[n])&0xFF;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;crc=(crc>>>8)^c}return (crc^0xFFFFFFFF)>>>0}
async function pngDPI(canvas,dpi){const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));const a=new Uint8Array(await blob.arrayBuffer());const head=String.fromCharCode.apply(null,a.subarray(0,120));if(head.indexOf('pHYs')>=0)return blob;const ppm=Math.round(dpi/0.0254);const ch=new Uint8Array(21);const dv=new DataView(ch.buffer);dv.setUint32(0,9);ch.set([0x70,0x48,0x59,0x73],4);dv.setUint32(8,ppm);dv.setUint32(12,ppm);ch[16]=1;dv.setUint32(17,crc32(ch.subarray(4,17)));const out=new Uint8Array(a.length+21);out.set(a.subarray(0,33));out.set(ch,33);out.set(a.subarray(33),54);return new Blob([out],{type:'image/png'})}
async function offerFile(filename,data){if(!dl){try{const blob=data instanceof Blob?data:new Blob([data],{type:/\.csv$/.test(filename)?'text/csv':'application/octet-stream'});if(navigator.canShare&&navigator.share){const f=new File([blob],filename,{type:blob.type||'image/png'});if(navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Saved '+filename)}catch(e){if(e&&e.name==='AbortError')return;toast('Press and hold the image to save it.')}return}try{await dl.save({filename,data});toast('Saved '+filename)}catch(e){const c=e&&e.code;if(c==='declined')return;if(c==='rate_limited'){toast('A save is already open.');return}toast('Saving is not available here.')}}

/* ---------- scanning ---------- */
async function decodeQR(file){if(typeof window.jsQR!=='function')throw new Error('nolib');const url=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  for(const max of [1200,800,1800]){const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*sc),h=Math.round(img.naturalHeight*sc);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,w,h);const d=x.getImageData(0,0,w,h);const r=window.jsQR(d.data,w,h,{inversionAttempts:'attemptBoth'});if(r&&r.data)return r.data}return null}finally{URL.revokeObjectURL(url)}}
function findByCode(raw){const t=String(raw||'').trim().replace(/^MRINV:/i,'');const u=t.toUpperCase();const it=Object.values(S.items).find(i=>String(i.code||'').toUpperCase()===u||i.id===t);if(it)return{type:'item',it};const k=Object.values(S.kits).find(k=>String(k.code||'').toUpperCase()===u||k.id===t);if(k)return{type:'kit',k};return null}
function buzz(ok){try{navigator.vibrate&&navigator.vibrate(ok?18:[40,60,40])}catch(e){}}
function handleCode(raw){const sc=UI.scan;const f=findByCode(raw);
  if(!f){sc.last={ok:false,text:String(raw).slice(0,80)};buzz(false);render();toast('No gear has that code');return}
  const ids=f.type==='item'?[f.it.id]:(f.k.itemIds||[]).filter(id=>S.items[id]);const label=f.type==='item'?f.it.name:f.k.name+' · '+ids.length+' items';
  sc.last={ok:true,type:f.type,id:f.type==='item'?f.it.id:f.k.id};buzz(true);
  if(sc.mode==='lookup'||!W()){openSheet(f.type==='item'?{kind:'item',id:f.it.id}:{kind:'kit',id:f.k.id})}
  else if(sc.mode==='out'||sc.mode==='in'){let n=0;ids.forEach(id=>{if(!sc.cart.includes(id)){sc.cart.push(id);n++}});toast(n?'Added '+label:'Already on the list')}
  else{const sh=S.shoots[sc.shootId];if(!sh){toast('Pick a shoot first');render();return}const fld=sc.mode==='pack'?'packed':'returned';const man=new Set(manifest(sh));const extra=ids.filter(id=>!man.has(id));const now=Date.now();const p={};p[fld]={};ids.forEach(id=>{p[fld][id]=now});if(extra.length&&sc.mode==='pack')p.extraIds=(sh.extraIds||[]).concat(extra);patch('shoots',sh.id,p);
    toast((sc.mode==='pack'?'Packed ':'Back: ')+label+(extra.length?(sc.mode==='pack'?' · added to list':' · not on this list'):''))}
  render()}

function checkout(ids,o){const now=Date.now();ids.forEach(id=>patch('items',id,{status:'out',holder:o.holder,dueAt:o.dueAt,outAt:now,shootId:o.shootId||null,lastHolder:o.holder}));
  if(o.shootId&&S.shoots[o.shootId]){const sh=S.shoots[o.shootId];const man=new Set(manifest(sh));const extra=ids.filter(id=>!man.has(id));const p={status:'out',packed:{}};ids.forEach(id=>{p.packed[id]=(sh.packed&&sh.packed[id])||now});if(extra.length)p.extraIds=(sh.extraIds||[]).concat(extra);patch('shoots',sh.id,p)}
  addLog({type:'out',itemIds:ids,holder:o.holder,shootId:o.shootId||null,note:o.note||null,dueAt:o.dueAt})}
function checkin(ids,o){const now=Date.now();const byShoot={};ids.forEach(id=>{const it=S.items[id];if(!it)return;if(it.shootId)(byShoot[it.shootId]=byShoot[it.shootId]||[]).push(id);const p={status:o.cond==='good'?'available':'maintenance',holder:null,dueAt:null,outAt:null,shootId:null};if(o.loc)p.location=o.loc;if(o.cond!=='good'){p.condition=o.cond==='damaged'?'Damaged':'Needs service';p.issue=o.note||p.condition}patch('items',id,p)});
  Object.keys(byShoot).forEach(sid=>{if(!S.shoots[sid])return;const p={returned:{}};byShoot[sid].forEach(id=>{p.returned[id]=(S.shoots[sid].returned&&S.shoots[sid].returned[id])||now});patch('shoots',sid,p)});
  const sid=Object.keys(byShoot)[0]||null;addLog({type:'in',itemIds:ids,cond:o.cond,note:o.note||null,shootId:sid})}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(!f)return;e.preventDefault();f(el.dataset,el,e)});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(!k)return;
  if(k==='q'){UI.q=e.target.value;render()}
  else if(k==='code'){UI.scan.q=e.target.value;render()}
  else if(k==='pickQ'){const s=top();s.pq=e.target.value;setHTML($('#pickList'),pickList(s))}
  if(e.target.classList.contains('err'))e.target.classList.remove('err')});

document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.ch;if(!k)return;const v=e.target.value;
  if(k==='fcat'){UI.cat=v;render()}else if(k==='floc'){UI.loc=v;render()}
  else if(k==='scanShoot'){UI.scan.shootId=v;render()}
  else if(k==='coShoot'){const sh=S.shoots[v];const due=sh&&sh.wrapAt?eveningOf(sh.wrapAt):nextEvening();const el=$('#coDue');if(el)el.value=toLocalInput(due)}
  else if(k==='fCat'){const cp=$('#codePrev');if(cp)cp.textContent='ID '+nextCode(v)+' · quantity over 1 gives each unit its own ID';const s=top();if(!s.iconTouched){const r=document.getElementById('ic-'+CATS[v].i);if(r)r.checked=true}}
  else if(k==='fIcon'){top().iconTouched=true}});
$('#scrim').addEventListener('click',()=>closeSheet(false));
$('#scanFile').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;toast('Reading label…');try{const code=await decodeQR(f);if(code)handleCode(code);else{buzz(false);toast('No QR code found. Fill the frame with the label and keep it flat.')}}catch(err){toast(err&&err.message==='nolib'?'The QR reader did not load. Type the ID instead.':'Could not read that photo.')}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('scanpad')){e.preventDefault();$('#scanFile').click()}});
/* swipe down to close a sheet */
(function(){let y0=null,dy=0;const sh=$('#sheet');sh.addEventListener('touchstart',e=>{if(!e.target.closest('.sh-head,.sh-grab'))return;y0=e.touches[0].clientY;dy=0;sh.style.transition='none'},{passive:true});sh.addEventListener('touchmove',e=>{if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);sh.style.transform='translateY('+dy+'px)'},{passive:true});sh.addEventListener('touchend',()=>{if(y0==null)return;y0=null;sh.style.transition='transform .2s ease';if(dy>110){sh.style.transform='';sh.style.transition='';closeSheet(false)}else{sh.style.transform=''}})})();

let tT=0;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;t.style.animation='none';void t.offsetWidth;t.style.animation='';clearTimeout(tT);tT=setTimeout(()=>{t.hidden=true},2600)}

setInterval(()=>{if(!document.hidden&&!UI.sheets.some(s=>SHEETS[s.kind].form))render()},60000);

/* ---------- boot ---------- */
async function init(){loadPrefs();render();
  const c=window.claude;
  if(c&&typeof c.use==='function'){const r=await Promise.all([c.use('db').catch(()=>null),c.use('user').catch(()=>null),c.use('downloads').catch(()=>null)]);db=r[0];user=r[1];dl=r[2]}
  if(!db&&CFG.url&&CFG.key){S.mode='team';try{S.auth=JSON.parse(localStorage.getItem(AUTHK)||'null')}catch(e){}if(S.auth)loadCache();render();if(S.auth)pull();setInterval(()=>{if(!document.hidden)pull()},4000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});window.addEventListener('online',pull);return}
  if(db){S.mode='cloud';if(user){try{S.uid=await user.id()}catch(e){}try{S.isOwner=await user.isOwner()}catch(e){}try{S.me=await user.me()}catch(e){}try{const cw=await user.can('data.write');S.canWrite=cw===false?false:(cw===true?true:null)}catch(e){}}subscribe()}
  else{S.mode='local';loadLocal();S.loaded=true}
  render()}
init();
})();
</script>
